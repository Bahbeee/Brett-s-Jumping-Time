<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHS Lions - Audio Teachable Machine & Dino Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Discord Dark Theme Color Variables */
        body {
            background-color: #1e1f22; /* Discord background dark */
            color: #dbdee1; /* Discord light gray text */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-header {
            background-color: #111214; /* Discord darkest title header */
            border-bottom: 1px solid #2e3035;
        }

        .card {
            background-color: #313338; /* Discord standard card surface */
            border: 1px solid #2b2d31;
        }

        .text-dark-theme-title {
            color: #f2f3f5; /* Clean bold text */
        }

        .text-muted-discord {
            color: #949ba4; /* Discord subtle gray text */
        }

        /* Status Module Style */
        #audio-container {
            background-color: #2b2d31 !important; /* Inset container dark */
            border: 2px solid #232428 !important;
            min-height: 120px;
        }

        /* Custom Discord Accent Color Buttons */
        .btn-discord-primary {
            background-color: #5865f2; /* Discord Blurple */
            color: #ffffff;
            border: none;
            transition: background 0.2s ease;
        }
        .btn-discord-primary:hover {
            background-color: #4752c4;
            color: #ffffff;
        }

        .btn-discord-secondary {
            background-color: #4e5058; /* Discord dark gray button */
            color: #f2f3f5;
            border: none;
            transition: background 0.2s ease;
        }
        .btn-discord-secondary:hover {
            background-color: #6d6f78;
            color: #f2f3f5;
        }

        /* Game Canvas System Layout */
        #gameCanvas {
            background-color: #2b2d31; /* Blends perfectly with Discord container */
            border: 2px solid #232428;
            display: block;
            margin: 0 auto;
        }

        /* Progress bars custom theme tracking */
        .progress {
            background-color: #1e1f22;
            border-radius: 4px;
        }
        .progress-bar {
            background-color: #5865f2; /* Default bars match discord blue */
        }

        /* Dynamic Mic Indicator Animation pulse */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.6; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<header class="p-3 d-flex justify-content-between align-items-center shadow-sm main-header">
    <h1 class="h5 m-0 fw-bold text-dark-theme-title">Westminster High School</h1>
    <span class="small text-muted-discord fst-italic">Home of the Lions</span>
</header>

<main class="container my-5">
    <div class="card shadow-lg">
        <div class="card-body p-4">
            
            <h2 class="h5 pb-2 mb-3 border-bottom fw-bold text-dark-theme-title">1. Machine Learning Control Panel</h2>
            <div class="mb-4">
                <button type="button" id="btn-start" class="btn btn-discord-primary px-4 fw-bold me-2 shadow-sm">Start Microphone & Game</button>
                <button type="button" id="btn-stop" class="btn btn-discord-secondary px-4 fw-bold shadow-sm">Stop</button>
            </div>

            <div class="row g-4 mt-2 mb-5">
                <div class="col-sm-6 text-center">
                    <div class="text-uppercase small fw-bold tracking-wider text-muted-discord mb-3">Audio Feed Status</div>
                    <div id="audio-container" class="d-flex flex-column align-items-center justify-content-center rounded p-4 shadow-inner">
                        <div id="mic-icon" class="fs-2">🎙️</div>
                        <div id="audio-status" class="small text-muted-discord mt-2 fw-bold">Microphone Off</div>
                    </div>
                </div>
                
                <div class="col-sm-6">
                    <div class="text-uppercase small fw-bold tracking-wider text-muted-discord mb-3">Classification Accuracy Matrix</div>
                    <div id="label-container" class="p-2">
                        <div class="text-muted-discord small fst-italic">Click Start to stream model matrices...</div>
                    </div>
                </div>
            </div>

            <h2 class="h5 pb-2 mb-3 border-bottom fw-bold text-dark-theme-title">2. Audio Velocity Game Layer</h2>
            <div class="text-center position-relative">
                <div class="text-uppercase class-trigger-hint small fw-bold tracking-wider text-muted-discord mb-3">Make your trained sound (Class 2) to command a jump!</div>
                
                <canvas id="gameCanvas" width="600" height="150" class="rounded shadow-sm"></canvas>
                
                <div id="gameOverScreen" class="position-absolute top-50 start-50 translate-middle d-none text-center p-4 rounded shadow-lg" style="background-color: #111214; border: 2px solid #232428; width: 280px;">
                    <h3 class="text-danger fw-bold mb-1">Game Over</h3>
                    <p class="mb-3 text-muted-discord fw-bold">Final Score: <span id="finalScore" style="color: #23a55a;">0</span></p>
                    <button type="button" id="btn-restart" class="btn btn-discord-primary fw-bold px-4 w-100">Restart Game</button>
                </div>
            </div>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@latest/dist/speech-commands.min.js"></script>
<script src="app.js"></script>
</body>
</html>
